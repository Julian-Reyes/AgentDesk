<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgentDesk ops dashboard: the approvals queue for the fictional Larchgrove Supply Co. demo." />
    <title>AgentDesk ops</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The theme before the first paint, as pickTheme in src/ops/theme.ts. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("agentdesk-theme");
        } catch (e) {}
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ops/main.tsx"></script>
  </body>
</html>
